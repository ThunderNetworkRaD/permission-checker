<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Checker Browser Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .test {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .test h3 {
            margin-top: 0;
            color: #333;
        }
        .test.passed {
            border-left: 5px solid #4CAF50;
        }
        .test.failed {
            border-left: 5px solid #f44336;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
        }
        .passed .result {
            background-color: #E8F5E9;
            color: #2E7D32;
        }
        .failed .result {
            background-color: #FFEBEE;
            color: #C62828;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Permission Checker Browser Test</h1>
    <p>Testing the permission-checker package in a browser environment.</p>
    
    <div id="test-results">
        <h2>Test Results</h2>
        <div id="test-container">
            <!-- Test results will be inserted here -->
        </div>
    </div>

    <script type="module">
        import { checkSingle, checkList } from '../dist/esm/index.js';

        const testContainer = document.getElementById('test-container');
        let passedTests = 0;
        let totalTests = 0;

        function runTest(description, testFn) {
            totalTests++;
            const testDiv = document.createElement('div');
            testDiv.className = 'test';
            testDiv.innerHTML = `<h3>${description}</h3><div class="result">Running test...</div>`;
            testContainer.appendChild(testDiv);

            try {
                const result = testFn();
                if (result === true) {
                    passedTests++;
                    testDiv.classList.add('passed');
                    testDiv.querySelector('.result').innerHTML = '✅ Passed';
                } else {
                    testDiv.classList.add('failed');
                    testDiv.querySelector('.result').innerHTML = `❌ Failed: ${result}`;
                }
            } catch (error) {
                testDiv.classList.add('failed');
                testDiv.querySelector('.result').innerHTML = `❌ Error: ${error.message}`;
                console.error(error);
            }
        }

        // Test checkSingle
        runTest('Wildcard permission', () => checkSingle('*', 'any.permission') === true);
        runTest('Exact match', () => checkSingle('user.read', 'user.read') === true);
        runTest('Hierarchical permission', () => checkSingle('user', 'user.read') === true);
        runTest('Non-matching permission', () => checkSingle('user.read', 'user.write') === false);

        // Test checkList
        runTest('All permissions present', 
            () => checkList(['user.read', 'user.write'], ['user.read', 'user.write']) === true);
        runTest('Some permissions missing', 
            () => checkList(['user.read'], ['user.read', 'admin.delete']) === false);
        runTest('Wildcard covers all', 
            () => checkList(['*'], ['user.read', 'admin.delete']) === true);

        // Update test summary
        const summary = document.createElement('div');
        summary.className = 'test';
        summary.style.fontWeight = 'bold';
        summary.style.fontSize = '1.2em';
        summary.style.textAlign = 'center';
        summary.style.marginTop = '20px';
        
        if (passedTests === totalTests) {
            summary.classList.add('passed');
            summary.innerHTML = `✅ All ${passedTests} tests passed!`;
        } else {
            summary.classList.add('failed');
            summary.innerHTML = `❌ ${passedTests} of ${totalTests} tests passed`;
        }
        
        testContainer.appendChild(summary);
    </script>
</body>
</html>
